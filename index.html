<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Chain → Paragraph</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #1a1a2e; color: #eee;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 24px;
  }
  .app { width: 100%; max-width: 640px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; color: #e94560; }
  .sub { font-size: 0.85rem; color: #888; margin-bottom: 20px; }
  .card {
    background: #16213e; border-radius: 12px; padding: 20px;
    margin-bottom: 16px; border: 1px solid #0f3460;
  }
  .chain { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; min-height: 34px; }
  .chip {
    background: #0f3460; padding: 6px 12px; border-radius: 20px;
    font-size: 0.85rem; border: 1px solid #e94560;
  }
  input[type=text], textarea {
    width: 100%; padding: 12px; border-radius: 8px;
    border: 1px solid #0f3460; background: #0d1b2a; color: #eee;
    font-size: 1rem; font-family: inherit;
  }
  textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
  input:focus, textarea:focus { outline: none; border-color: #e94560; }
  button {
    background: #e94560; color: white; border: none; padding: 12px 20px;
    border-radius: 8px; font-size: 1rem; cursor: pointer; margin-top: 12px;
    font-weight: 600;
  }
  button:hover { background: #c73550; }
  button:disabled { background: #555; cursor: not-allowed; }
  .msg { font-size: 0.85rem; margin-top: 8px; min-height: 20px; }
  .err { color: #ff6b6b; }
  .ok { color: #51cf66; }
  .hint { font-size: 0.8rem; color: #888; margin-top: 6px; }
  .progress { font-size: 0.85rem; color: #aaa; margin-bottom: 8px; }
  .hidden { display: none; }
  .wordtag {
    display: inline-block; padding: 3px 10px; border-radius: 14px;
    font-size: 0.8rem; margin: 3px; background: #0f3460;
  }
  .wordtag.used { background: #2b8a3e; }
  .wordtag.missing { background: #862e2e; }
  .scorebox { text-align: center; padding: 16px; }
  .bignum { font-size: 3rem; font-weight: 700; color: #e94560; }
  ul.feedback { list-style: none; margin-top: 12px; }
  ul.feedback li { padding: 6px 0; font-size: 0.9rem; border-bottom: 1px solid #0f3460; }
</style>
</head>
<body>
<div class="app">
  <h1>Word Chain → Paragraph</h1>
  <div class="sub">Build a chain of 10 words, then write a real paragraph using them.</div>

  <!-- LEVEL 1 -->
  <div id="level1" class="card">
    <div class="progress">Level 1 — Word Chain <span id="progress"></span></div>
    <div class="chain" id="chain"></div>
    <input type="text" id="wordInput" placeholder="Type a word and press Enter" autocomplete="off" spellcheck="false">
    <div class="msg" id="msg1"></div>
    <div class="hint" id="hint1">Start with any word to begin.</div>
  </div>

  <!-- LEVEL 2 -->
  <div id="level2" class="card hidden">
    <div class="progress">Level 2 — Write a paragraph using your words</div>
    <div id="wordList" style="margin-bottom:12px;"></div>
    <textarea id="paragraph" placeholder="Write a real paragraph. Each word must be used in a meaningful sentence..." spellcheck="true"></textarea>
    <button id="gradeBtn">Grade my paragraph</button>
    <div class="msg" id="msg2"></div>
  </div>

  <!-- RESULT -->
  <div id="result" class="card hidden">
    <div class="scorebox">
      <div class="bignum" id="finalScore">0</div>
      <div style="color:#888;font-size:0.85rem;">out of 100</div>
    </div>
    <div id="wordBreakdown" style="margin-top:16px;"></div>
    <ul class="feedback" id="feedbackList"></ul>
    <button onclick="location.reload()">Play again</button>
  </div>
</div>

<script>
/* ============ SMALL BUILT-IN WORD LIST ============ */
/* Not exhaustive — enough for a prototype. Add words to extend. */
const WORDS = new Set(`apple banana cat dog elephant fish grape hat ice juice
kite lion monkey nest orange pig queen rabbit snake tiger umbrella violin
water xylophone yak zebra ant bear cow duck eagle frog goat horse insect
jacket king lamp mouse nurse owl pen quail rat sheep tree uncle vase wolf
yarn zoo boat car door egg fire gold hand iron jar key leaf moon nail
ocean plate quiz rope sun table urn van wall box yellow zip angel bird
cloud dream forest garden house island jungle kitchen light mountain
night open park river stone window young animal bread candle dance
energy family garden happy idea journey kind laugh magic number
object people quiet reason simple travel useful value wonder
about after again always answer around because before begin
below between bring build carry change close cold come could
cover cross deep draw early earth easy enough even every
face fact fall feel find first follow food form found
give good great group grow half hard hear help here
high home hour house idea important keep kind know
land large last late learn leave left life light
line list little live long look make many mean
might mind more most move much must name near
need never new next night number often only open
order other over own page paper part people
place plan play point power problem put question
quick quiet quite read real really right room
run same say school seem sentence set several
short should show side small something sound start
state still story strong such system take tell
than that their them then there these they
thing think this those through time together too
toward turn under until upon use very want
water way well went were what when where which
while white who whole why will with word
work world would write year yes your
`.split(/\s+/).map(w => w.toLowerCase()).filter(Boolean));

/* Common verbs for "meaningful sentence" heuristic */
const VERBS = new Set(`is are was were be been am have has had do does did
go goes went make makes made say says said see sees saw take takes took
come comes came know knows knew get gets got give gives gave find finds found
think thinks thought tell tells told become becomes became show shows showed
leave leaves left feel feels felt put puts bring brings brought begin begins
began keep keeps kept hold holds held write writes wrote stand stands stood
hear hears heard let lets mean means meant set sets run runs ran move moves
moved play plays played pay pays paid read reads eat eats ate drink drinks
drank sleep sleeps slept walk walks walked talk talks talked look looks looked
want wants wanted need needs needed use uses used work works worked call calls
called try tries tried ask asks asked help helps helped turn turns turned
start starts started live lives lived believe believes believed
`.split(/\s+/).filter(Boolean));

/* ============ STATE ============ */
let chain = [];
const TARGET = 10;
let usedLower = new Set();

const $ = id => document.getElementById(id);
const wordInput = $('wordInput');

/* ============ LEVEL 1 LOGIC ============ */
function lastLetter() {
  if (chain.length === 0) return null;
  return chain[chain.length - 1].slice(-1).toLowerCase();
}

function validateWord(raw) {
  const w = raw.trim().toLowerCase();
  if (!w) return { ok: false, msg: 'Type a word first.' };
  if (!/^[a-z]+$/.test(w)) return { ok: false, msg: 'Letters only, please.' };
  if (w.length < 2) return { ok: false, msg: 'Too short — at least 2 letters.' };
  if (usedLower.has(w)) return { ok: false, msg: `"${w}" was already used.` };
  if (!WORDS.has(w)) return { ok: false, msg: `"${w}" isn't in the word list (try a common word).` };
  const ll = lastLetter();
  if (ll && w[0] !== ll) return { ok: false, msg: `Must start with "${ll.toUpperCase()}" (last letter of "${chain[chain.length-1]}").` };
  return { ok: true, word: w };
}

function renderChain() {
  $('chain').innerHTML = chain.map(w => `<span class="chip">${w}</span>`).join('');
  $('progress').textContent = `${chain.length} / ${TARGET}`;
  const ll = lastLetter();
  $('hint1').textContent = ll
    ? `Next word must start with "${ll.toUpperCase()}".`
    : 'Start with any word to begin.';
}

function submitWord() {
  const res = validateWord(wordInput.value);
  const msg = $('msg1');
  if (!res.ok) {
    msg.className = 'msg err';
    msg.textContent = res.msg;
    return;
  }
  chain.push(res.word);
  usedLower.add(res.word);
  wordInput.value = '';
  msg.className = 'msg ok';
  msg.textContent = `Added "${res.word}".`;
  renderChain();
  wordInput.focus();
  if (chain.length >= TARGET) startLevel2();
}

wordInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') submitWord();
});

/* ============ LEVEL 2 LOGIC ============ */
function startLevel2() {
  $('level1').classList.add('hidden');
  $('level2').classList.remove('hidden');
  renderWordList();
}

function renderWordList(usedMap) {
  const html = chain.map(w => {
    let cls = 'wordtag';
    if (usedMap) cls += usedMap[w] ? ' used' : ' missing';
    return `<span class="${cls}">${w}</span>`;
  }).join('');
  $('wordList').innerHTML = html;
}

/* ============ GRADING (heuristic, no AI) ============ */
function countSentences(text) {
  // crude: split on . ! ? followed by space or end
  const parts = text.split(/[.!?]+/).map(s => s.trim()).filter(s => s.length > 0);
  return parts.length;
}

function hasVerb(sentence) {
  const tokens = sentence.toLowerCase().match(/[a-z']+/g) || [];
  return tokens.some(t => VERBS.has(t));
}

function gradeParagraph(text) {
  const feedback = [];
  let score = 0;

  const lower = text.toLowerCase();
  const tokens = lower.match(/[a-z']+/g) || [];
  const tokenSet = new Set(tokens);

  // 1) Required words — 40 points (4 each)
  const usedMap = {};
  let usedCount = 0;
  chain.forEach(w => {
    const present = tokenSet.has(w);
    usedMap[w] = present;
    if (present) usedCount++;
  });
  const wordScore = usedCount * 4;
  score += wordScore;
  feedback.push(`${usedCount}/${chain.length} required words used (+${wordScore})`);

  // 2) Length — 20 points (need at least 60 words)
  const wordCount = tokens.length;
  const lengthScore = Math.min(20, Math.round((wordCount / 60) * 20));
  score += lengthScore;
  feedback.push(`${wordCount} words total (+${lengthScore}/20, aim for 60+)`);

  // 3) Sentence count — 20 points (need at least 4 sentences)
  const sentences = countSentences(text);
  const sentScore = Math.min(20, sentences * 5);
  score += sentScore;
  feedback.push(`${sentences} sentences (+${sentScore}/20, aim for 4+)`);

  // 4) Meaningful sentences — 20 points
  // Each required word must appear in a sentence that has a verb
  const rawSentences = text.split(/[.!?]+/).map(s => s.trim()).filter(Boolean);
  let meaningful = 0;
  chain.forEach(w => {
    const inSentence = rawSentences.some(s => {
      const t = s.toLowerCase().match(/[a-z']+/g) || [];
      return t.includes(w) && hasVerb(s);
    });
    if (inSentence) meaningful++;
  });
  const meanScore = Math.round((meaningful / chain.length) * 20);
  score += meanScore;
  feedback.push(`${meaningful}/${chain.length} words inside a real sentence with a verb (+${meanScore}/20)`);

  // 5) Word-stuffing penalty
  // If a required word appears 3+ times, penalize (gaming the checker)
  let stuffed = 0;
  chain.forEach(w => {
    const count = tokens.filter(t => t === w).length;
    if (count >= 3) stuffed++;
  });
  if (stuffed > 0) {
    const pen = stuffed * 3;
    score = Math.max(0, score - pen);
    feedback.push(`${stuffed} word(s) repeated 3+ times — possible stuffing (-${pen})`);
  }

  score = Math.min(100, Math.max(0, Math.round(score)));

  // Show missing words in the breakdown
  renderWordList(usedMap);

  return { score, feedback, usedMap };
}

$('gradeBtn').addEventListener('click', () => {
  const text = $('paragraph').value.trim();
  const msg = $('msg2');
  if (!text) {
    msg.className = 'msg err';
    msg.textContent = 'Write something first.';
    return;
  }
  const { score, feedback } = gradeParagraph(text);
  $('finalScore').textContent = score;
  $('feedbackList').innerHTML = feedback.map(f => `<li>${f}</li>`).join('');
  $('level2').classList.add('hidden');
  $('result').classList.remove('hidden');
});

/* ============ INIT ============ */
renderChain();
wordInput.focus();
</script>
</body>
</html>
